[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virector"
version = "0.1.0"
description = "Cloud-ready director-control scaffold for local AI video generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "boto3==1.43.62",
  "fastapi==0.115.14",
  "gradio==5.35.0",
  "numpy==2.2.6",
  "pillow==11.2.1",
  "psutil==7.2.2",
  "PyJWT[crypto]==2.13.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "python-multipart==0.0.20",
  "requests==2.32.4",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]
ltx = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.0",
  "diffusers==0.39.0",
  "ftfy==6.3.1",
  "imageio[ffmpeg]==2.37.4",
  "protobuf==7.35.1",
  "sentencepiece==0.2.2",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==4.57.6",
]
runpod = [
  "runpod==1.9.1",
]

[tool.setuptools.packages.find]
include = ["virector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
