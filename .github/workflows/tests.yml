name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runpod-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate RunPod Dockerfile
        run: docker build --check -f Dockerfile.runpod .

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Apply migrations to local Postgres
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --local --level warning

      - name: Stop local Postgres
        if: always()
        run: supabase stop --no-backup

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install ".[dev,runpod]"

      - name: Install FFmpeg contract dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Type-check web client
        run: npm run typecheck

      - name: Build web client
        run: npm run build
