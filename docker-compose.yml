services:
  web:
    build:
      context: ./web
      args:
        VIRECTOR_API_INTERNAL_URL: http://virector:8000
    container_name: virector-web
    ports:
      - "3000:3000"
    depends_on:
      - virector
    restart: unless-stopped

  virector:
    build:
      context: .
      args:
        INSTALL_LTX: "${VIRECTOR_INSTALL_LTX:-0}"
    container_name: virector-starter
    gpus: all
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VIRECTOR_MODELS_DIR: /data/models
      VIRECTOR_CACHE_DIR: /data/cache
      VIRECTOR_OUTPUTS_DIR: /data/outputs
      HF_HOME: /data/cache/huggingface
      TORCH_HOME: /data/cache/torch
      XDG_CACHE_HOME: /data/cache
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    volumes:
      - type: bind
        source: "${VIRECTOR_HOST_MODELS_DIR:-E:/Virector/models}"
        target: /data/models
      - type: bind
        source: "${VIRECTOR_HOST_CACHE_DIR:-E:/Virector/cache}"
        target: /data/cache
      - type: bind
        source: "${VIRECTOR_HOST_OUTPUTS_DIR:-E:/Virector/outputs}"
        target: /data/outputs
      - type: bind
        source: "${VIRECTOR_HOST_UPLOADS_DIR:-E:/Virector/uploads}"
        target: /data/uploads
    restart: unless-stopped
